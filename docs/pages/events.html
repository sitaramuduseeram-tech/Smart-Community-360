<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Community Events | Smart Community 360°</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8f6;
            color: #1d2b24;
        }


        /* HEADER */

        .header {
            background: #123c2a;
            color: white;

            padding: 18px 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 20px;
            font-weight: bold;
        }


        .brand-icon {
            width: 40px;
            height: 40px;

            background: #35b87f;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }


        .back-btn {
            color: white;
            text-decoration: none;

            background: #35b87f;

            padding: 10px 16px;

            border-radius: 8px;

            font-size: 14px;
        }


        /* MAIN */

        .container {
            max-width: 1150px;

            margin: 35px auto;

            padding: 0 20px;
        }


        .page-title {
            margin-bottom: 28px;
        }


        .page-title h1 {
            font-size: 30px;

            margin-bottom: 8px;
        }


        .page-title p {
            color: #718078;
        }


        /* EVENTS GRID */

        .events-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }


        .event-card {
            background: white;

            border-radius: 18px;

            overflow: hidden;

            border: 1px solid #edf2ef;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);

            transition: 0.3s;
        }


        .event-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.10);
        }


        /* EVENT TOP */

        .event-top {
            height: 150px;

            background:
                linear-gradient(
                    135deg,
                    #123c2a,
                    #35b87f
                );

            color: white;

            padding: 22px;

            position: relative;
        }


        .event-icon {
            font-size: 42px;

            margin-bottom: 12px;
        }


        .event-category {
            position: absolute;

            top: 18px;
            right: 18px;

            background: rgba(255,255,255,0.18);

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 11px;
        }


        /* EVENT CONTENT */

        .event-content {
            padding: 20px;
        }


        .event-content h2 {
            font-size: 19px;

            margin-bottom: 12px;
        }


        .event-info {
            display: grid;

            gap: 8px;

            margin-bottom: 15px;
        }


        .event-info p {
            color: #596861;

            font-size: 13px;
        }


        .event-description {
            color: #718078;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 18px;
        }


        /* BUTTON */

        .register-btn {
            width: 100%;

            border: none;

            background: #35b87f;

            color: white;

            padding: 12px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            transition: 0.3s;
        }


        .register-btn:hover {
            background: #219b68;
        }


        .register-btn.registered {
            background: #16814f;

            cursor: default;
        }


        /* REGISTERED EVENTS */

        .registered-section {
            margin-top: 35px;

            background: white;

            border-radius: 18px;

            padding: 22px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.05);
        }


        .registered-section h2 {
            margin-bottom: 18px;
        }


        .registered-list {
            display: grid;

            gap: 10px;
        }


        .registered-item {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 14px;

            background: #f7faf8;

            border-radius: 10px;
        }


        .registered-item h4 {
            margin-bottom: 4px;
        }


        .registered-item p {
            color: #718078;

            font-size: 12px;
        }


        .registered-badge {
            background: #ddf7e9;

            color: #16814f;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: bold;
        }


        .empty {
            color: #718078;

            font-size: 14px;

            padding: 10px 0;
        }


        /* RESPONSIVE */

        @media (max-width: 950px) {

            .events-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 650px) {

            .header {
                padding: 15px 20px;
            }


            .brand span {
                display: none;
            }


            .events-grid {
                grid-template-columns: 1fr;
            }


            .container {
                margin-top: 25px;
            }


            .page-title h1 {
                font-size: 25px;
            }


            .registered-item {
                align-items: flex-start;

                gap: 10px;

                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="header">


    <div class="brand">

        <div class="brand-icon">
            🌱
        </div>

        <span>
            Smart Community 360°
        </span>

    </div>


    <a
        href="dashboard.html"
        class="back-btn"
    >
        ← Dashboard
    </a>


</header>


<!-- MAIN -->

<main class="container">


    <div class="page-title">

        <h1>
            Community Events 📅
        </h1>

        <p>
            Discover and participate in activities happening in your community.
        </p>

    </div>


    <!-- EVENTS -->

    <div
        class="events-grid"
        id="eventsGrid"
    ></div>


    <!-- REGISTERED EVENTS -->

    <section class="registered-section">

        <h2>
            My Registered Events
        </h2>


        <div
            class="registered-list"
            id="registeredList"
        ></div>

    </section>


</main>


<script>


    // ==========================================
    // EVENT DATA
    // ==========================================

    const events = [

        {
            id: "EVT001",

            title: "Community Clean-Up Drive",

            category: "Environment",

            icon: "🧹",

            date: "28 September 2026",

            time: "7:00 AM - 10:00 AM",

            location: "Central Park",

            description:
                "Join local citizens to clean public spaces and make our community cleaner and healthier."
        },


        {
            id: "EVT002",

            title: "Tree Plantation Drive",

            category: "Green Community",

            icon: "🌳",

            date: "4 October 2026",

            time: "8:00 AM - 11:00 AM",

            location: "Community Garden",

            description:
                "Plant trees and contribute towards creating a greener and more sustainable community."
        },


        {
            id: "EVT003",

            title: "Road Safety Awareness",

            category: "Safety",

            icon: "🚦",

            date: "10 October 2026",

            time: "10:00 AM - 12:00 PM",

            location: "Community Hall",

            description:
                "Learn about road safety, responsible driving and pedestrian awareness."
        },


        {
            id: "EVT004",

            title: "Digital Literacy Camp",

            category: "Education",

            icon: "💻",

            date: "17 October 2026",

            time: "9:00 AM - 1:00 PM",

            location: "Community Center",

            description:
                "A digital awareness program helping citizens learn essential online services and technology."
        },


        {
            id: "EVT005",

            title: "Health & Wellness Camp",

            category: "Health",

            icon: "❤️",

            date: "24 October 2026",

            time: "8:00 AM - 1:00 PM",

            location: "Town Community Hall",

            description:
                "Participate in a community wellness event focused on healthy living and awareness."
        },


        {
            id: "EVT006",

            title: "Smart City Innovation Meet",

            category: "Innovation",

            icon: "💡",

            date: "1 November 2026",

            time: "10:00 AM - 2:00 PM",

            location: "Innovation Center",

            description:
                "Share ideas and discuss technology solutions for building smarter communities."
        }

    ];


    // ==========================================
    // LOCAL STORAGE
    // ==========================================

    let registeredEvents =
        JSON.parse(
            localStorage.getItem(
                "smartCommunityRegisteredEvents"
            )
        ) || [];


    // ==========================================
    // DISPLAY EVENTS
    // ==========================================

    const eventsGrid =
        document.getElementById(
            "eventsGrid"
        );


    function displayEvents() {

        eventsGrid.innerHTML = "";


        events.forEach(event => {

            const isRegistered =
                registeredEvents.includes(
                    event.id
                );


            const card =
                document.createElement("div");


            card.className =
                "event-card";


            card.innerHTML = `

                <div class="event-top">

                    <div class="event-icon">
                        ${event.icon}
                    </div>

                    <span class="event-category">
                        ${event.category}
                    </span>

                </div>


                <div class="event-content">

                    <h2>
                        ${event.title}
                    </h2>


                    <div class="event-info">

                        <p>
                            📅 ${event.date}
                        </p>

                        <p>
                            🕐 ${event.time}
                        </p>

                        <p>
                            📍 ${event.location}
                        </p>

                    </div>


                    <p class="event-description">

                        ${event.description}

                    </p>


                    <button
                        class="register-btn
                        ${isRegistered ? "registered" : ""}"
                        data-id="${event.id}"
                        ${isRegistered ? "disabled" : ""}
                    >

                        ${
                            isRegistered
                            ? "✓ Registered"
                            : "Register Now"
                        }

                    </button>

                </div>

            `;


            eventsGrid.appendChild(card);

        });


        attachRegisterButtons();

    }


    // ==========================================
    // REGISTER BUTTONS
    // ==========================================

    function attachRegisterButtons() {

        const buttons =
            document.querySelectorAll(
                ".register-btn:not(.registered)"
            );


        buttons.forEach(button => {

            button.addEventListener(
                "click",
                function () {

                    const eventId =
                        this.dataset.id;


                    if (
                        registeredEvents.includes(
                            eventId
                        )
                    ) {
                        return;
                    }


                    registeredEvents.push(
                        eventId
                    );


                    localStorage.setItem(
                        "smartCommunityRegisteredEvents",
                        JSON.stringify(
                            registeredEvents
                        )
                    );


                    displayEvents();

                    displayRegisteredEvents();


                    alert(
                        "You have successfully registered for this event! 🎉"
                    );

                }
            );

        });

    }


    // ==========================================
    // REGISTERED EVENTS
    // ==========================================

    const registeredList =
        document.getElementById(
            "registeredList"
        );


    function displayRegisteredEvents() {

        registeredList.innerHTML = "";


        if (
            registeredEvents.length === 0
        ) {

            registeredList.innerHTML = `

                <p class="empty">
                    You haven't registered for any events yet.
                </p>

            `;

            return;

        }


        registeredEvents.forEach(eventId => {

            const event =
                events.find(
                    item =>
                        item.id === eventId
                );


            if (!event) {
                return;
            }


            const item =
                document.createElement("div");


            item.className =
                "registered-item";


            item.innerHTML = `

                <div>

                    <h4>
                        ${event.icon}
                        ${event.title}
                    </h4>

                    <p>
                        📅 ${event.date}
                        &nbsp; • &nbsp;
                        📍 ${event.location}
                    </p>

                </div>


                <span class="registered-badge">
                    Registered
                </span>

            `;


            registeredList.appendChild(
                item
            );

        });

    }


    // ==========================================
    // INITIAL LOAD
    // ==========================================

    displayEvents();

    displayRegisteredEvents();


</script>


</body>

</html>
