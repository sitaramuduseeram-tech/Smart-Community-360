<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Issues | Smart Community 360°</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8f6;
            color: #1d2b24;
        }

        /* HEADER */

        .header {
            background: #123c2a;
            color: white;
            padding: 18px 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 20px;
            font-weight: bold;
        }

        .brand-icon {
            width: 40px;
            height: 40px;

            background: #35b87f;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .back-btn {
            color: white;
            text-decoration: none;

            background: #35b87f;

            padding: 10px 16px;

            border-radius: 8px;

            font-size: 14px;
        }

        /* MAIN */

        .container {
            max-width: 1100px;
            margin: 35px auto;

            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #718078;
        }

        /* SEARCH */

        .search-box {
            background: white;

            padding: 20px;

            border-radius: 16px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.06);

            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;

            padding: 14px 16px;

            border: 1px solid #dce7e1;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        .search-box input:focus {
            border-color: #35b87f;
        }

        /* REPORT CARD */

        .reports-container {
            display: grid;

            gap: 18px;
        }

        .report-card {
            background: white;

            padding: 22px;

            border-radius: 16px;

            border: 1px solid #edf2ef;

            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .report-header {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;

            margin-bottom: 15px;
        }

        .report-title {
            font-size: 18px;

            margin-bottom: 6px;
        }

        .report-id {
            color: #718078;

            font-size: 12px;
        }

        /* STATUS */

        .status {
            padding: 7px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            white-space: nowrap;
        }

        .status.submitted {
            background: #e4efff;
            color: #3573b9;
        }

        .status.progress {
            background: #fff3d9;
            color: #b77a00;
        }

        .status.resolved {
            background: #ddf7e9;
            color: #16814f;
        }

        /* DETAILS */

        .report-details {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 15px;
        }

        .detail {
            background: #f7faf8;

            padding: 12px;

            border-radius: 10px;
        }

        .detail-label {
            display: block;

            font-size: 11px;

            color: #718078;

            margin-bottom: 5px;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 13px;

            font-weight: 600;
        }

        .description {
            color: #596861;

            font-size: 14px;

            line-height: 1.6;

            padding-top: 15px;

            border-top: 1px solid #edf2ef;
        }

        /* EMPTY */

        .empty-state {
            background: white;

            padding: 60px 20px;

            text-align: center;

            border-radius: 16px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .empty-icon {
            font-size: 50px;

            margin-bottom: 15px;
        }

        .empty-state h2 {
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #718078;

            margin-bottom: 20px;
        }

        .report-btn {
            display: inline-block;

            background: #35b87f;

            color: white;

            text-decoration: none;

            padding: 12px 20px;

            border-radius: 9px;

            font-weight: 600;
        }

        /* RESPONSIVE */

        @media (max-width: 800px) {

            .report-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .header {
                padding: 15px 20px;
            }

            .brand span {
                display: none;
            }

        }

        @media (max-width: 500px) {

            .report-header {
                flex-direction: column;
            }

            .report-details {
                grid-template-columns: 1fr;
            }

            .container {
                margin-top: 25px;
            }

            .page-title h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="brand">

        <div class="brand-icon">
            🌱
        </div>

        <span>
            Smart Community 360°
        </span>

    </div>


    <a
        href="dashboard.html"
        class="back-btn"
    >
        ← Dashboard
    </a>

</header>


<!-- MAIN -->

<main class="container">


    <div class="page-title">

        <h1>
            Track Your Issues 🔎
        </h1>

        <p>
            Monitor the status of problems you have reported.
        </p>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search by report ID, problem, category or location..."
        >

    </div>


    <!-- REPORTS -->

    <div
        class="reports-container"
        id="reportsContainer"
    ></div>


</main>


<script>

    // ==========================================
    // LOAD REPORTS
    // ==========================================

    const reportsContainer =
        document.getElementById("reportsContainer");


    const searchInput =
        document.getElementById("searchInput");


    let reports =
        JSON.parse(
            localStorage.getItem(
                "smartCommunityReports"
            )
        ) || [];


    // ==========================================
    // STATUS CLASS
    // ==========================================

    function getStatusClass(status) {

        if (!status) {
            return "submitted";
        }

        const value =
            status.toLowerCase();

        if (value.includes("progress")) {
            return "progress";
        }

        if (value.includes("resolved")) {
            return "resolved";
        }

        return "submitted";
    }


    // ==========================================
    // DISPLAY REPORTS
    // ==========================================

    function displayReports(data) {

        reportsContainer.innerHTML = "";


        if (data.length === 0) {

            reportsContainer.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        📋
                    </div>

                    <h2>
                        No Reports Found
                    </h2>

                    <p>
                        You haven't submitted any reports yet.
                    </p>

                    <a
                        href="report.html"
                        class="report-btn"
                    >
                        Report a Problem
                    </a>

                </div>

            `;

            return;
        }


        data.forEach(report => {

            const card =
                document.createElement("div");

            card.className =
                "report-card";


            card.innerHTML = `

                <div class="report-header">

                    <div>

                        <h2 class="report-title">
                            ${report.title || "Community Issue"}
                        </h2>

                        <div class="report-id">
                            Report ID:
                            <strong>
                                ${report.id}
                            </strong>
                        </div>

                    </div>


                    <span
                        class="status ${getStatusClass(report.status)}"
                    >
                        ${report.status || "Submitted"}
                    </span>

                </div>


                <div class="report-details">

                    <div class="detail">

                        <span class="detail-label">
                            Category
                        </span>

                        <span class="detail-value">
                            ${report.category || "Not specified"}
                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Priority
                        </span>

                        <span class="detail-value">
                            ${report.priority || "Normal"}
                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Location
                        </span>

                        <span class="detail-value">
                            ${report.location || "Not specified"}
                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Submitted
                        </span>

                        <span class="detail-value">
                            ${report.date || "Recently"}
                        </span>

                    </div>

                </div>


                <div class="description">

                    ${report.description || "No description provided."}

                </div>

            `;


            reportsContainer.appendChild(card);

        });

    }


    // ==========================================
    // SEARCH
    // ==========================================

    searchInput.addEventListener(
        "input",
        function () {

            const search =
                this.value
                    .toLowerCase()
                    .trim();


            if (!search) {

                displayReports(reports);

                return;

            }


            const filtered =
                reports.filter(report => {

                    return (

                        (report.id || "")
                            .toLowerCase()
                            .includes(search)

                        ||

                        (report.title || "")
                            .toLowerCase()
                            .includes(search)

                        ||

                        (report.category || "")
                            .toLowerCase()
                            .includes(search)

                        ||

                        (report.location || "")
                            .toLowerCase()
                            .includes(search)

                    );

                });


            displayReports(filtered);

        }
    );


    // ==========================================
    // INITIAL LOAD
    // ==========================================

    displayReports(reports);

</script>


</body>

</html>
