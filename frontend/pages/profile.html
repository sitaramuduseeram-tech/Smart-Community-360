<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile | Smart Community 360°</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;

            background: #f4f8f6;

            color: #1d2b24;
        }


        /* HEADER */

        .header {
            background: #123c2a;

            color: white;

            padding: 18px 35px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .brand {
            display: flex;

            align-items: center;

            gap: 12px;

            font-size: 20px;

            font-weight: bold;
        }


        .brand-icon {
            width: 40px;

            height: 40px;

            background: #35b87f;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;
        }


        .back-btn {
            color: white;

            text-decoration: none;

            background: #35b87f;

            padding: 10px 16px;

            border-radius: 8px;

            font-size: 14px;
        }


        /* MAIN */

        .container {
            max-width: 950px;

            margin: 40px auto;

            padding: 0 20px;
        }


        .page-title {
            margin-bottom: 25px;
        }


        .page-title h1 {
            font-size: 30px;

            margin-bottom: 8px;
        }


        .page-title p {
            color: #718078;
        }


        /* PROFILE */

        .profile-card {
            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.07);
        }


        .profile-header {
            background:
                linear-gradient(
                    135deg,
                    #123c2a,
                    #35b87f
                );

            padding: 35px;

            color: white;

            display: flex;

            align-items: center;

            gap: 25px;
        }


        .avatar {
            width: 100px;

            height: 100px;

            border-radius: 50%;

            background: white;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #123c2a;

            font-size: 36px;

            font-weight: bold;

            border: 4px solid rgba(255,255,255,0.5);

            overflow: hidden;
        }


        .avatar img {
            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        .profile-header h2 {
            font-size: 25px;

            margin-bottom: 7px;
        }


        .profile-header p {
            opacity: 0.9;

            font-size: 14px;
        }


        /* DETAILS */

        .profile-body {
            padding: 30px;
        }


        .section-title {
            font-size: 19px;

            margin-bottom: 20px;
        }


        .details-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }


        .detail-card {
            background: #f7faf8;

            padding: 18px;

            border-radius: 12px;

            border: 1px solid #edf2ef;
        }


        .detail-icon {
            font-size: 22px;

            margin-bottom: 10px;
        }


        .detail-label {
            display: block;

            color: #718078;

            font-size: 12px;

            margin-bottom: 6px;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }


        .detail-value {
            font-size: 15px;

            font-weight: 600;

            word-break: break-word;
        }


        /* STATS */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-top: 25px;
        }


        .stat {
            text-align: center;

            padding: 20px;

            background: #f7faf8;

            border-radius: 12px;
        }


        .stat-number {
            font-size: 28px;

            font-weight: bold;

            color: #219b68;

            margin-bottom: 5px;
        }


        .stat-label {
            color: #718078;

            font-size: 12px;
        }


        /* STATUS */

        .account-status {
            margin-top: 25px;

            padding: 16px;

            background: #ddf7e9;

            border-radius: 12px;

            color: #16814f;

            font-size: 14px;

            font-weight: 600;
        }


        /* LOADING */

        .loading {
            text-align: center;

            padding: 60px;

            color: #718078;
        }


        /* ERROR */

        .error {
            text-align: center;

            padding: 50px 20px;
        }


        .error h2 {
            margin-bottom: 10px;
        }


        .error p {
            color: #718078;

            margin-bottom: 20px;
        }


        .login-btn {
            display: inline-block;

            background: #35b87f;

            color: white;

            text-decoration: none;

            padding: 11px 18px;

            border-radius: 8px;
        }


        /* RESPONSIVE */

        @media (max-width: 650px) {

            .header {
                padding: 15px 20px;
            }


            .brand span {
                display: none;
            }


            .container {
                margin-top: 25px;
            }


            .profile-header {
                padding: 25px;

                flex-direction: column;

                text-align: center;
            }


            .profile-body {
                padding: 20px;
            }


            .details-grid {
                grid-template-columns: 1fr;
            }


            .stats {
                grid-template-columns: 1fr;
            }


            .page-title h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="header">


    <div class="brand">

        <div class="brand-icon">
            🌱
        </div>

        <span>
            Smart Community 360°
        </span>

    </div>


    <a
        href="dashboard.html"
        class="back-btn"
    >
        ← Dashboard
    </a>


</header>


<!-- MAIN -->

<main class="container">


    <div class="page-title">

        <h1>
            My Profile 👤
        </h1>

        <p>
            View your Smart Community 360° account information.
        </p>

    </div>


    <!-- PROFILE CARD -->

    <div
        class="profile-card"
        id="profileCard"
    >

        <div class="loading">

            Loading your profile...

        </div>

    </div>


</main>


<script>


    // ==========================================
    // API
    // ==========================================

    const API_BASE_URL =
        "https://smart-community-360-1.onrender.com";


    // ==========================================
    // LOAD PROFILE
    // ==========================================

    async function loadProfile() {

        const token =
            localStorage.getItem(
                "smartCommunityToken"
            );


        // No token

        if (!token) {

            window.location.href =
                "login.html";

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/api/auth/me`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`,

                            "Content-Type":
                                "application/json"
                        }
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                localStorage.removeItem(
                    "smartCommunityToken"
                );

                localStorage.removeItem(
                    "smartCommunityUser"
                );

                window.location.href =
                    "login.html";

                return;

            }


            // Save latest user

            localStorage.setItem(
                "smartCommunityUser",
                JSON.stringify(data.user)
            );


            displayProfile(
                data.user
            );


        }
        catch (error) {

            console.error(
                "Profile loading error:",
                error
            );


            // Try localStorage

            const savedUser =
                localStorage.getItem(
                    "smartCommunityUser"
                );


            if (savedUser) {

                displayProfile(
                    JSON.parse(savedUser)
                );

            }
            else {

                showError();

            }

        }

    }


    // ==========================================
    // DISPLAY PROFILE
    // ==========================================

    function displayProfile(user) {


        const profileCard =
            document.getElementById(
                "profileCard"
            );


        const name =
            user.name || "Citizen";


        const email =
            user.email || "Not available";


        const phone =
            user.phone || "Not available";


        const city =
            user.city || "Not provided";


        const role =
            user.role || "citizen";


        const points =
            user.points || 0;


        const isActive =
            user.isActive !== false;


        // Get initials

        const initials =
            name
                .split(" ")
                .filter(Boolean)
                .map(
                    word =>
                        word.charAt(0)
                )
                .slice(0, 2)
                .join("")
                .toUpperCase();


        profileCard.innerHTML = `

            <div class="profile-header">

                <div class="avatar">

                    ${
                        user.profileImage

                        ?

                        `<img
                            src="${user.profileImage}"
                            alt="Profile"
                        >`

                        :

                        initials
                    }

                </div>


                <div>

                    <h2>
                        ${name}
                    </h2>

                    <p>
                        Smart Community 360° Citizen
                    </p>

                </div>

            </div>


            <div class="profile-body">


                <h2 class="section-title">
                    Personal Information
                </h2>


                <div class="details-grid">


                    <div class="detail-card">

                        <div class="detail-icon">
                            👤
                        </div>

                        <span class="detail-label">
                            Full Name
                        </span>

                        <span class="detail-value">
                            ${name}
                        </span>

                    </div>


                    <div class="detail-card">

                        <div class="detail-icon">
                            📧
                        </div>

                        <span class="detail-label">
                            Email Address
                        </span>

                        <span class="detail-value">
                            ${email}
                        </span>

                    </div>


                    <div class="detail-card">

                        <div class="detail-icon">
                            📱
                        </div>

                        <span class="detail-label">
                            Phone Number
                        </span>

                        <span class="detail-value">
                            ${phone}
                        </span>

                    </div>


                    <div class="detail-card">

                        <div class="detail-icon">
                            🏙️
                        </div>

                        <span class="detail-label">
                            City
                        </span>

                        <span class="detail-value">
                            ${city}
                        </span>

                    </div>


                    <div class="detail-card">

                        <div class="detail-icon">
                            👥
                        </div>

                        <span class="detail-label">
                            Account Role
                        </span>

                        <span class="detail-value">
                            ${role}
                        </span>

                    </div>


                    <div class="detail-card">

                        <div class="detail-icon">
                            🟢
                        </div>

                        <span class="detail-label">
                            Account Status
                        </span>

                        <span class="detail-value">

                            ${
                                isActive
                                ? "Active"
                                : "Inactive"
                            }

                        </span>

                    </div>


                </div>


                <!-- STATS -->

                <div class="stats">


                    <div class="stat">

                        <div
                            class="stat-number"
                            id="reportCount"
                        >
                            0
                        </div>

                        <div class="stat-label">
                            Reports Submitted
                        </div>

                    </div>


                    <div class="stat">

                        <div class="stat-number">
                            ${points}
                        </div>

                        <div class="stat-label">
                            Community Points
                        </div>

                    </div>


                    <div class="stat">

                        <div
                            class="stat-number"
                            id="eventCount"
                        >
                            0
                        </div>

                        <div class="stat-label">
                            Events Registered
                        </div>

                    </div>


                </div>


                <div class="account-status">

                    ${
                        isActive
                        ? "🟢 Your account is active and ready to participate in the community."
                        : "🔴 Your account is currently inactive."
                    }

                </div>


            </div>

        `;


        // Count reports

        const reports =
            JSON.parse(
                localStorage.getItem(
                    "smartCommunityReports"
                )
            ) || [];


        document.getElementById(
            "reportCount"
        ).textContent =
            reports.length;


        // Count registered events

        const registeredEvents =
            JSON.parse(
                localStorage.getItem(
                    "smartCommunityRegisteredEvents"
                )
            ) || [];


        document.getElementById(
            "eventCount"
        ).textContent =
            registeredEvents.length;

    }


    // ==========================================
    // ERROR
    // ==========================================

    function showError() {

        document.getElementById(
            "profileCard"
        ).innerHTML = `

            <div class="error">

                <h2>
                    Unable to Load Profile
                </h2>

                <p>
                    Please login again to view your profile.
                </p>

                <a
                    href="login.html"
                    class="login-btn"
                >
                    Login
                </a>

            </div>

        `;

    }


    // ==========================================
    // START
    // ==========================================

    loadProfile();


</script>


</body>

</html>
